version: '3.8'
services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    # 不对外暴露端口，仅后端容器内网访问
    volumes:
      - ./data/redis:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      # 控制台仅本机可访问
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    # 不对外暴露端口，仅后端容器内网访问
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=novel_translate
    networks:
      - app-network

  backend:
    image: ai-translate-backend:latest
    container_name: ai-translate-backend
    restart: always
    depends_on:
      - redis
      - mysql
      - minio
    ports:
      - "8124:8124"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: ai-translate-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
